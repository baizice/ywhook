name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Show environment
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Commit failure log
        if: failure()
        run: |
          git config user.name 'ci-bot'
          git config user.email 'ci-bot@users.noreply.github.com'
          git add -f build.log
          git commit -m 'ci: build failure log [skip ci]' || true
          timeout 60 git push || true

      - name: Collect artifacts
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp -v {} out/ \;
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ywhook-apk-${{ github.sha }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Commit success marker
        if: success()
        run: |
          git config user.name 'ci-bot'
          git config user.email 'ci-bot@users.noreply.github.com'
          printf 'build success\ncommit: %s\ntime: %s\napk: %s\n' "$GITHUB_SHA" "$(date -u)" "$(ls out/*.apk | head -1)" > ci-status.txt
          git add -f ci-status.txt
          git commit -m 'ci: build success [skip ci]' || true
          timeout 60 git push || true

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false